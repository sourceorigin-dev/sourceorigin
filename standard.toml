# How SourceOrigin applies the engineering standard; the README of the
# `sourceorigin-standard` crate lists its rules and every key here.

# The lines of CI that run Cargo rather than a recipe: the published crates on
# the oldest supported Rust, and installing piquelctl, which ships no binaries.
cargo-in-ci = [
    "cargo check --locked --all-features --package sourceorigin-common --package sourceorigin-crypto --package sourceorigin-auth",
    "cargo install --locked piquelctl",
]

# The pull request checks of .github/workflows/pr.yml, read at a pull
# request's base. The scopes are the ones titles on main use.
[pr-checks]
scopes = [
    "admin",
    "agents",
    "audit",
    "auth",
    "auth-sdk",
    "browser",
    "cli",
    "common",
    "config",
    "crypto",
    "database",
    "deliveries",
    "deps",
    "dev",
    "infra",
    "jobs",
    "lint",
    "operations",
    "sdk",
    "t3",
    "telemetry",
    "ui",
    "user",
    "web",
]
approvers = ["PiquelChips"]

# Each deviation lists the files its findings were in when SourceOrigin adopted
# the standard; `cargo xtask standard --fix` drops each file once it complies.
[deviations]

