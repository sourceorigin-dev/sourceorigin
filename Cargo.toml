[workspace]
resolver = "3"
members = [
    "apps/auth-service",
    "apps/web",
    "crates/auth-sdk",
    "crates/common",
    "crates/crypto",
    "crates/database",
    "crates/telemetry",
    "crates/ui",
    "tools/xtask",
]

[workspace.package]
edition = "2024"
# Non-commercial by default. The SDK and its dependencies (auth-sdk, common, crypto) are Apache-2.0;
# every other crate sets `publish = false`. See docs/dev/releasing.md.
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/sourceorigin-dev/sourceorigin"
homepage = "https://sourceorigin.dev"
# The oldest Rust the published crates build with, which the `msrv` CI job checks.
rust-version = "1.88"
# Every crate shares it, and the published ones are released together.
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

# Every Clippy warning fails CI: `just rust lint` runs Clippy with `-D warnings`.
# The groups sit at priority -1 so the single lints below can override them.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# Tests may expect, panic and dbg (see clippy.toml); production code
# propagates errors and logs through tracing.
expect_used = "warn"
panic = "warn"
todo = "warn"
unreachable = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
missing_docs_in_private_items = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# `let _ =` hides a `#[must_use]` result, such as a dropped error.
let_underscore_must_use = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, never a `foo.rs` beside `foo/`.
self_named_module_files = "warn"

[workspace.dependencies]
# Local crates name the workspace's version, as cargo-deny and crates.io require;
# the published ones require each other at exactly that version.
sourceorigin-common        = { version = "=0.1.0", path = "crates/common" }
sourceorigin-crypto        = { version = "=0.1.0", path = "crates/crypto" }
sourceorigin-repository    = { version = "0.1.0", path = "crates/database" }
sourceorigin-telemetry     = { version = "0.1.0", path = "crates/telemetry" }
sourceorigin-auth          = { version = "0.1.0", path = "crates/auth-sdk" }
sourceorigin-ui            = { version = "0.1.0", path = "crates/ui" }

# External crates
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clickhouse = { version = "0.15.3", default-features = false }
http = "1.3"
# Auth's own HTTP/1.1 server, for the header-read timeout and graceful drain
# axum::serve does not expose; both are already in the tree through axum.
hyper = { version = "1.10", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["server-graceful", "service", "tokio"] }
ipnet = "2.12"
# Only webauthn-rs uses OpenSSL; naming it here builds it vendored, so no build
# needs the system's headers. Everything else uses aws-lc-rs.
openssl = { version = "0.10", features = ["vendored"] }
# OTLP/HTTP with protobuf, sent through the workspace's reqwest: no gRPC stack.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs", "internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "logs", "internal-logs"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-appender-tracing = "0.33"
# The public suffix list, compiled in, for the domains WebAuthn related origins count.
psl = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# RFC 8785 canonical JSON, which the audit chain hashes.
serde_json_canonicalizer = "0.4"
serde_urlencoded = "0.7"
sourceorigin-standard = "0.1.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "uuid", "json", "ipnet", "migrate", "macros"] }
thiserror = "2.0"
# Server-rendered pages: only the router, `view!` and the tower service; its defaults add a browser runtime.
topcoat = { version = "0.10", default-features = false }
tokio = { version = "1.48" }
# The receiver stream a data export's body reads; already in the tree through sqlx.
tokio-stream = { version = "0.1", default-features = false }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
unicode-normalization = "0.1"
unicode-security = "0.1"
uuid = { version = "1.19", features = ["v7", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui", "workaround-google-passkey-specific-issues"] }

# Profile pictures: decodes the upload formats in pure Rust and writes JPEG.
# No AVIF, SVG or WebP until its decoder checks a frame's size before decoding.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }

# Transactional email: SMTP over implicit TLS or required STARTTLS, with rustls
# on aws-lc-rs and webpki roots, never native-tls/OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
# Decodes the SMTP user in AUTH_SMTP_URL; already in the tree through url and lettre.
percent-encoding = "2.3"

# The workspace's one cryptographic library, and rustls's provider for every TLS client.
# Its RSA is constant-time, which `rsa`'s RUSTSEC-2023-0071 is not.
aws-lc-rs = "1.18"
secrecy = "0.10"
# Test-only: TypeScript declarations of the protocol types, which the `common` tests write
# to packages/auth/src/protocol.ts. Its serde warnings are off: it cannot read `deserialize_with`.
ts-rs = { version = "12.0", features = ["url-impl", "no-serde-warnings"] }
trybuild = "1.0"
# Test-only: snapshots of rendered output, such as every email kind's bodies, so
# a change to what they say shows in review. No colored diffs, so no `console`.
insta = { version = "1.49", default-features = false }
# Test-only: a self-signed certificate and TLS listener so tests reach auth over HTTPS.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
# HTTP over rustls on aws-lc-rs, trusting the platform's certificate roots (the
# images install ca-certificates). No HTTP/2: every peer speaks HTTP/1.1.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
webauthn-rs-proto = "0.5.5"
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

# Line tables keep file and line numbers in backtraces but drop most variable and type info,
# also in tests, which inherit this profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
