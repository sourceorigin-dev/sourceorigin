# Continuous integration: each job runs the `just` recipes docs/dev/testing.md lists.
# Pull requests run only the jobs their changes can affect, by `changes` below.
# `if: *tests` and `if: *builds` mark the steps main skips; see docs/dev/testing.md.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No incremental artifacts: they only bloat CI caches.
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: short

jobs:
  # Decides which jobs a pull request needs, by .github/filters.yml.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.reference == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
      infra: ${{ github.event_name != 'pull_request' || steps.filter.outputs.infra == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: .github/filters.yml

  checks:
    name: checks
    needs: changes
    if: github.event_name != 'push' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-deny,cargo-machete@0.9.2
      - run: just rust fmt-check
      - run: just rust unused
      - if: needs.changes.outputs.deps == 'true'
        run: just rust audit

  # Skipped on main, whose pnpm store `package` and `e2e` save.
  web:
    name: web
    needs: changes
    if: github.event_name != 'push' && (needs.changes.outputs.web == 'true' || needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - &install-just
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      # pnpm's version comes from package.json's packageManager.
      - &setup-pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: just install
      - run: just web fmt-check
      - run: just web check
      - run: just web lint
      - run: just web unused
      - run: just web test
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.x
      - run: just web smoke
      - if: needs.changes.outputs.deps == 'true'
        run: just web audit

  # Beside `rust`: its instrumented coverage build is no cache for these.
  rust-lint:
    name: rust-lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *install-just
      - &rust-cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Bump the prefix when a job needs a new cache; the key includes the job's ID.
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Run on main only when rust-cache restored no exact match.
      - if: &builds github.event_name != 'push' || steps.rust-cache.outputs.cache-hit != 'true'
        run: just rust lint
      - if: *builds
        run: just doc
      - if: *builds
        run: just doc-test ${{ github.event_name == 'push' && '--list' || '' }}

  # `just publish` without uploading.
  package:
    name: package
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *install-just
      - *setup-pnpm
      - *setup-node
      - *rust-cache
      - run: just install
      - if: *builds
        run: just publish --dry-run

  # Builds the published crates with their `rust-version`; warnings aren't errors.
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Overrides rust-toolchain.toml for every later step.
      - name: Install the oldest supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - *install-just
      - *rust-cache
      - if: *builds
        run: cargo check --locked --all-features --package sourceorigin-common --package sourceorigin-crypto --package sourceorigin-auth
      - if: *builds
        run: just rust features

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TEST_ANALYTICS_URL: http://sourceorigin@localhost:8123/sourceorigin
      TEST_ANALYTICS_PASSWORD: scratch
    # Disposable servers for the database and analytics tests, and for the
    # browser suite. Pushes to main run no test, so they start no service: GitHub
    # skips a service whose image is empty.
    services:
      postgres: &postgres
        image: ${{ github.event_name != 'push' && 'postgres:18-bookworm' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
      # The image infra/piqueld.toml runs, with the owner `just analytics scratch` creates.
      clickhouse:
        image: ${{ github.event_name != 'push' && 'clickhouse/clickhouse-server:26.8.46.6' || '' }}
        env:
          CLICKHOUSE_USER: sourceorigin
          CLICKHOUSE_PASSWORD: scratch
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports: ['8123:8123']
        options: >-
          --health-cmd "wget --quiet --spider http://127.0.0.1:8123/ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - *rust-cache
      # sqlx-cli publishes no prebuilt binaries; rust-cache keeps what is installed.
      - if: *builds
        run: just db install-sqlx
      # Every unit and database test, instrumented; main skips it, as the queue tested it.
      - if: &tests github.event_name != 'push'
        run: just coverage
      - if: *tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: target/lcov.info
          if-no-files-found: error
      # Fails a migration that breaks a cached query, even if no test runs it.
      - if: *tests
        run: just db prepare-check
      # When main saves a new cache, this compiles without running a test.
      - if: github.event_name == 'push' && steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          just coverage-build
          just db check

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres: *postgres
      # Mailpit receives auth's email; main starts none.
      mailpit:
        image: ${{ github.event_name != 'push' && 'axllent/mailpit:v1.27' || '' }}
        ports: ['1025:1025', '8025:8025']
    env:
      E2E_AUTH_URL: https://localhost:3443
      E2E_ALLOW_SELF_SIGNED_TLS: '1'
      # migrate provisions the restricted role that everything else connects as.
      AUTH_DATABASE_OWNER_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      AUTH_DATABASE_URL: postgres://sourceorigin_auth@localhost:5432/postgres?sslmode=disable
      AUTH_DATABASE_PASSWORD: env://E2E_DATABASE_PASSWORD
      E2E_DATABASE_PASSWORD: runtime
      AUTH_PUBLIC_BASE_URL: https://localhost:3443
      AUTH_PUBLIC_LISTENER: 127.0.0.1:3000
      # Each signup takes a new invitation from the CLI.
      AUTH_INVITE_REQUIRED: 'true'
      E2E_INVITE: target/debug/auth-service invite create
      AUTH_SMTP_URL: smtp://127.0.0.1:1025
      E2E_MAIL_URL: http://127.0.0.1:8025
      # sourceorigin.dev on its own host, whose policies auth's pages link.
      AUTH_WEB_ORIGIN: https://web.localhost:3443
      E2E_WEB_URL: https://web.localhost:3443
      WEB_LISTENER: 127.0.0.1:3002
      WEB_AUTH_ORIGIN: https://localhost:3443
      # The most the request counters hold, so no spec waits on a budget.
      AUTH_REQUESTS_PER_MINUTE: '2147483647'
      # The dashboard on its own origin, another port of auth's host.
      AUTH_ADMIN_LISTENER: 127.0.0.1:3001
      AUTH_ADMIN_ORIGIN: https://localhost:3444
      E2E_ADMIN_URL: https://localhost:3444
      E2E_GRANT_ADMIN: target/debug/auth-service admin grant
      E2E_RECOVER: target/debug/auth-service user recover
      # The secret `just web browser-client` registers for server.spec.ts; it guards nothing.
      E2E_SERVER_CLIENT_SECRET: YnJvd3Nlci1lMmUtc2VydmVyIHNlY3JldCBmb3IgY2k
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *install-just
      - *setup-pnpm
      - *setup-node
      - *rust-cache
      - run: just install
      - if: *builds
        run: just rust build
      # The keys reach every later step, the suite's CLI commands included.
      - name: Generate the keys
        if: *tests
        run: |
          just auth generate-secret "$RUNNER_TEMP/key-encryption-key"
          just auth generate-secret "$RUNNER_TEMP/token-digest-key"
          openssl rand -hex 32 > "$RUNNER_TEMP/audit-key"
          {
            echo "AUTH_KEY_ENCRYPTION_KEY=file://$RUNNER_TEMP/key-encryption-key"
            echo "AUTH_TOKEN_DIGEST_KEY=file://$RUNNER_TEMP/token-digest-key"
            echo "AUTH_AUDIT_KEY_PROVIDER=file://$RUNNER_TEMP/audit-key"
          } >> "$GITHUB_ENV"
      # HTTPS origins only, as in production: Caddy terminates TLS with its local CA.
      - name: Start the auth service and sourceorigin.dev
        if: *tests
        run: |
          cat > "$RUNNER_TEMP/Caddyfile" <<'EOF'
          {
            auto_https disable_redirects
            skip_install_trust
          }
          localhost:3443 {
            reverse_proxy 127.0.0.1:3000
          }
          localhost:3444 {
            reverse_proxy 127.0.0.1:3001
          }
          web.localhost:3443 {
            reverse_proxy 127.0.0.1:3002
          }
          EOF
          docker run --detach --name caddy --network host --volume "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          target/debug/auth-service migrate
          just web browser-client
          target/debug/auth-service serve > "$RUNNER_TEMP/auth.log" 2>&1 &
          target/debug/sourceorigin-web > "$RUNNER_TEMP/web.log" 2>&1 &
          curl -kfsS --retry 30 --retry-delay 1 --retry-all-errors "$E2E_AUTH_URL/health/ready"
          curl -kfsS --retry 30 --retry-delay 1 --retry-all-errors "$E2E_WEB_URL/health"
      # The headless build matching the pinned Playwright.
      - if: *tests
        run: pnpm exec playwright install --only-shell chromium
      - if: *tests
        run: just web test-browser
      - if: failure()
        run: |
          cat "$RUNNER_TEMP"/*.log || true
          docker logs caddy || true

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The docs image caches no layers, so main, which tests nothing, skips it.
      - if: *tests
        run: docker build --file infra/docs.Dockerfile .
      # Both Rust targets share the `backend` stage, which builds once.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/rust.Dockerfile
          target: auth
          cache-from: type=gha,scope=auth
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=auth,ignore-error=true' || '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/rust.Dockerfile
          target: web
          cache-from: type=gha,scope=web
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=web,ignore-error=true' || '' }}

  # piquelctl publishes no prebuilt binaries; rust-cache keeps it.
  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *install-just
      - *rust-cache
      - if: *builds
        run: cargo install --locked piquelctl
      - if: *tests
        run: just infra check

  # Every change, since the rules read more than the Rust sources.
  standard:
    name: standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *install-just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just standard

  # mdBook and lychee at the versions `just install-tools` installs.
  docs:
    name: docs
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,mdbook@0.5.4,lychee@0.24.2
      - run: just docs

  ci:
    name: ci
    if: always()
    needs:
      - changes
      - checks
      - web
      - rust
      - rust-lint
      - package
      - msrv
      - e2e
      - docker
      - infra
      - standard
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, web, rust, rust-lint, package, msrv, e2e, docker, infra, docs
          jobs: ${{ toJSON(needs) }}
