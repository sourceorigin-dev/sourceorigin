# The one Rust that builds SourceOrigin: every checkout, every CI job but `msrv`
# (which checks the oldest Rust the published crates support, Cargo.toml's
# `rust-version`) and the images in infra/rust.Dockerfile, which install it
# from this file. Raise it here to move them all to a new release.
[toolchain]
channel = "1.100.0"
components = [ "rustfmt", "clippy" ]
