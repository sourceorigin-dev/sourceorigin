[advisories]
version = 2
ignore = [
    # chrono is unmaintained, with no maintained successor it names yet. It
    # holds every timestamp the service stores and sends (150 files), so moving
    # off it is its own change; no vulnerability is reported against it.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no vulnerability, and no successor yet" },
]

[licenses]
version = 2
# Permissive dependencies and unchanged MPL library files may be distributed
# with SourceOrigin's code; retain their notices in source distributions.
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0"]
exceptions = [
    # lettre's quoted-printable encoder. 0BSD is public-domain equivalent, even
    # more permissive than MIT, so it is allowed for this crate rather than everywhere.
    { crate = "quoted_printable", allow = ["0BSD"] },
    # SourceOrigin's own non-commercial crates. PolyForm is allowed for them by name,
    # never for third-party dependencies.
    { crate = "auth-service", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-web", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-repository", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-telemetry", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "sourceorigin-ui", allow = ["PolyForm-Noncommercial-1.0.0"] },
    { crate = "xtask", allow = ["PolyForm-Noncommercial-1.0.0"] },
]

[bans]
# A `*` requirement accepts any future release, breaking or malicious.
# Workspace crates name their version (Cargo.toml) so they don't count as one.
wildcards = "deny"
# Duplicates come from dependencies' own requirements, which this workspace
# can't change; warning about them would only bury real failures.
multiple-versions = "allow"
# Each crypto and database primitive has one owner, so a dependency cannot quietly
# add a second one. `wrappers` lists the only crates that may depend on it; any
# other path to it fails. Names are checked against `cargo tree -i`.
deny = [
    { crate = "ring", reason = "aws-lc-rs is the cryptography provider" },
    { crate = "sha2", wrappers = ["sqlx-core", "sqlx-macros-core", "sqlx-postgres"], reason = "digests come from `sourceorigin-crypto`; only SQLx's own SCRAM sign-in uses it" },
    { crate = "rand", wrappers = ["opentelemetry_sdk", "sqlx-postgres", "webauthn-rs-core"], reason = "randomness comes from `sourceorigin-crypto`; only these dependencies draw their own" },
    { crate = "openssl", wrappers = ["auth-service", "webauthn-attestation-ca", "webauthn-authenticator-rs", "webauthn-rs-core"], reason = "only webauthn-rs links it; auth-service names it for its `vendored` feature alone and never calls it" },
    { crate = "aws-lc-rs", wrappers = ["rcgen", "rustls", "rustls-webpki", "sourceorigin-crypto"], reason = "SourceOrigin's cryptography is `sourceorigin-crypto`; the TLS stack, and the test certificates' generator, bring their own" },
    { crate = "sqlx", wrappers = ["sourceorigin-common", "sourceorigin-repository"], reason = "SQL lives in `sourceorigin-repository`; `sourceorigin-common` only decodes identifiers from columns" },
]

# Crates come from crates.io only: never another registry or a Git repository.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
