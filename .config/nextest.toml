# A hung test, such as one waiting on a lock or a database that never answers,
# fails with a report instead of stalling validation indefinitely.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# The tests share one database, and with it every advisory lock, even in a schema
# of their own. Tests that hold one of those locks for most of their run wait for
# it under a timeout, the statement timeout or their own, which on a busy machine
# runs out for the last of several waiting ones. So each lock's tests run one at
# a time, as the lock would make them anyway.
[test-groups]
# The signing key lock, which the key change tests hold for their whole transaction.
signing-keys = { max-threads = 1 }
# The audit chain lock, which the audit tests take to seal, and the audit
# verification lock, which its verifier tests also take and expect to be free.
# They contend over the chain lock either way, so they share one group.
audit = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
(package(auth-service) & (
    test(/^keys::tests::/)
    | test(/^admin::tests::keys::/)
    | test(=web::admin::tests::signing_keys_are_rotated_and_revoked_from_the_dashboard)
))
| (package(sourceorigin-repository) & test(/^repositories::signing_keys::tests::/))
'''
test-group = "signing-keys"

[[profile.default.overrides]]
filter = 'package(auth-service) & test(/^audit::tests::/)'
test-group = "audit"
