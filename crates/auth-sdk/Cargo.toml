[package]
name = "sourceorigin-auth"
description = "Validate auth.sourceorigin.dev tokens, declare typed scopes and sign users in"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["oauth", "openid-connect", "jwt", "authentication", "axum"]
categories = ["authentication", "web-programming"]

[features]
# Extractors, layers and login routes for axum.
axum = ["dep:axum", "dep:tower", "dep:tracing"]

[dependencies]
sourceorigin-common = { workspace = true, features = ["client-spans"] }
sourceorigin-crypto.workspace = true

axum = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# A mutex and `OnceCell`, and the deadlines on requests.
tokio = { workspace = true, features = ["sync", "time"] }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
axum.workspace = true
# Tests sign their tokens with `Rs256Key`.
sourceorigin-crypto = { workspace = true, features = ["server"] }
# The tests' and the example's runtime and listeners, and paused time, so a test
# can wait out a deadline without waiting.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
trybuild.workspace = true

[[example]]
name = "notes"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true
# Labels feature-gated items with the features they need.
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
