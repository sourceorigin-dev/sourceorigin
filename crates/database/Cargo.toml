[package]
name = "sourceorigin-repository"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Under the PolyForm Noncommercial License: never published.
publish = false

[dependencies]
chrono.workspace = true
sourceorigin-common = { workspace = true, features = ["admin", "config", "events", "server", "sqlx"] }
sourceorigin-crypto = { workspace = true, features = ["server"] }
sourceorigin-telemetry.workspace = true
secrecy.workspace = true
serde_json.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# The schema's skeleton test compares `handle_skeleton` with `Handle::skeleton`.
sourceorigin-common = { workspace = true, features = ["similarity"] }
# The integration tests under `tests/` start from the fixtures.
sourceorigin-repository = { workspace = true, features = ["test-util"] }

[features]
# Helpers that let other crates' tests observe stored state and move a
# recovery's clock, and the fixtures tests start from.
test-util = []

[lints]
workspace = true
